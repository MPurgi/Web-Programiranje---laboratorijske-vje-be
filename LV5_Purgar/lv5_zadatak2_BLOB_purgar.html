<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadatak 2 - BLOB</title>
</head>
<body>
    
    <h1>Dohvaćanje slike pomoću BLOB-a</h1>

    <img id="slika" alt="Dohvaćena slika" width="400">

    <script>
        async function dohvatiSliku(){
            try{
                const odgovor = await fetch ("slika.jpg");

                if(!odgovor.ok){
                    throw new Error(`HTTP ${odgovor.status}`);
                }

                const blob = await odgovor.blob();

                const urlSlike = URL.createObjectURL(blob);

                document.getElementById("slika").src = urlSlike;

            } catch(greska){
                console.error("Učitavanje nije upsjelo: ", greska);
            }
        }

        dohvatiSliku();
    </script>
</body>
</html>
