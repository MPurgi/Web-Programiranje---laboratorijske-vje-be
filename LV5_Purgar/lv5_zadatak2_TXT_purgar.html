<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadatak2-text</title>
</head>
<body>
    
    <h1>Dohvaćanje tekstualne datoteke</h1>

    <pre id="tekst"></pre>

    <script>
        async function dohvatiTekst(){
            try{
                const odgovor = await fetch("himna.txt");

                if(!odgovor.ok){
                    throw new Error(`HTTP ${odgovor.stauts}`);
                }

                const tekst = await odgovor.text();

                document.getElementById("tekst").textContent = tekst;

            } catch (greska){
                console.error("Učitavanje nije uspjelo: ", greska);
            }

        }

        dohvatiTekst();
    </script>
</body>
</html>
